<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PersonalGym LP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- =========================================
        ファーストビュー
    ========================================== -->
    <header class="fv">
        <div class="fv-container">
            <div class="fv-imgbox">
                <img src="img/women.png" alt="トレーニングしている女性" class="fv-img">
            </div>

            <div class="fv-textbox">
                <div class="fv-logo">
                    PERSONAL GYM
                </div>
                <p class="fv-sub">
                    理想の身体へ、最短ルートで
                </p>
                <h2 class="fv-title">
                    完全個室のマンツーマン指導<br>
                    30代からの「引き締め」ボディメイク
                </h2>
                <div class="fv-btn">
                    <a href="#" class="fv-btn-word">
                        【限定10名様】<br>
                        無料体験トレーニングに申し込む
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main>

        <!-- =========================================
            お悩み共感
        ========================================== -->
        <section class="trouble">
            <div class="trouble-container">
                <h2 class="trouble-title">
                    こんな「お悩み」、抱えていませんか?
                </h2>
                <div class="trouble-wrapper">
                    <div class="trouble-card">
                        <div class="trouble-num">
                            01
                        </div>
                        <img src="img/img1.jpg" alt="料理" class="trouble-img">
                        <p class="trouble-text">
                            自己流の糖質制限で<br>
                            リバウンドを<br>
                            繰り返している
                        </p>
                    </div>
                    <div class="trouble-card">
                        <div class="trouble-num">
                            02
                        </div>
                        <img src="img/img2.jpg" alt="運動" class="trouble-img">
                        <p class="trouble-text">
                            20代の頃と同じ<br>
                            運動量なのに<br>
                            体重が落ちなくなった
                        </p>
                    </div>
                    <div class="trouble-card">
                        <div class="trouble-num">
                            03
                        </div>
                        <img src="img/img3.jpg" alt="ストレッチ" class="trouble-img">
                        <p class="trouble-text">
                            普通のジムだと<br>
                            人の目が気になって<br>
                            集中できない
                        </p>
                    </div>
                </div>
            </div>
        </section>

    </main>
    
</body>
</html>
